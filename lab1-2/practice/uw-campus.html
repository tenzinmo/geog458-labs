<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 2 UW Seattle campus</title>
  <!-- Load the matching v3.6.0 JavaScript and CSS files required for this exercise. -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; background: #dfe7e1; }
    #status { position: absolute; z-index: 1; left: 20px; top: 20px; max-width: min(400px, calc(100% - 110px)); padding: 16px; background: white; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Leave this container empty so Mapbox can add its canvas here. -->
  <div id="map" aria-label="Part 2 UW Seattle campus"></div>
  <p id="status" role="status">Loading the map…</p>
  <script>
    // Public browser token for this practice map. Requests use the account that issued it.
    const publicToken = 'pk.eyJ1IjoibW9vb29uc3RlciIsImEiOiJjbXY0NmozcTkwejEzMnpvZmd5b2FpM2ZpIn0.-lR_bJORKIX0-1Sa1z8nAQ';
    const statusMessage = document.getElementById('status');
    if (!publicToken.startsWith('pk.')) {
      statusMessage.textContent = 'This practice map needs your Mapbox public token. No map has loaded yet.';
    } else if (typeof mapboxgl === 'undefined') {
      statusMessage.textContent = 'The map library could not load. Check your connection and reload.';
    } else {
      // Show a status message if Mapbox cannot start, for example when WebGL is unavailable.
      try {
        mapboxgl.accessToken = publicToken; // Give Mapbox the public token used to load map resources.
        // Create one map and set the view that appears when this practice page opens.
        const mymap = new mapboxgl.Map({
          container: 'map', // Match the id of the HTML map container.
          style: 'mapbox://styles/mapbox/light-v11', // Keep the Light basemap required for Part 2.
          projection: 'globe', // Display this practice map as a globe.
          center: [-122.3035, 47.6553], // Coordinates use longitude first, then latitude.
          zoom: 16 // Start at campus scale. A higher zoom value shows less area.
        });
        mymap.addControl(new mapboxgl.FullscreenControl()); // Let the viewer enter and leave fullscreen.
        mymap.addControl(new mapboxgl.NavigationControl()); // Add zoom buttons and a compass that resets north.
        mymap.on('load', () => { statusMessage.hidden = true; });
        mymap.on('error', () => {
          statusMessage.hidden = false;
          statusMessage.textContent = 'A map resource failed to load. Check your token, allowed URLs, connection and console.';
        });
      } catch (error) {
        statusMessage.hidden = false;
        statusMessage.textContent = 'The map could not start. Check browser WebGL support and the console, then reload.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
